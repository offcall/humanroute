<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			/* Home-screen app only: draw to the screen edge so the tab bar can pad for the home indicator.
			   Safari keeps the default fit, so its floating toolbar is not added to the tab bar's padding. */
			if (matchMedia("(display-mode: standalone)").matches || navigator.standalone === true) {
				document.querySelector('meta[name="viewport"]').content += ", viewport-fit=cover";
			}
		</script>
		<meta name="theme-color" content="#FAF8F5" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<title>HumanRoute</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
